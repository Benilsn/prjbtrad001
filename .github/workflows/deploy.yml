name: Deploy to Oracle Cloud

on:
  push:
    # This repo's default branch is `master`. Change here if you rename it.
    branches: [master]

  # Manual run: Actions -> Deploy to Oracle Cloud -> Run workflow.
  # The branch picker in that dialog chooses what gets built, so any branch can
  # be deployed without merging — useful for trying a change on the VM first.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para confirmar (evita clique acidental)'
        required: true
        default: ''
      reason:
        description: 'Motivo (aparece no resumo da execução)'
        required: false
        default: 'deploy manual'

concurrency:
  # Never let two deploys race onto the same VM.
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────
  #  Build natively on arm64.
  #
  #  Oracle's Always Free instances are Ampere (aarch64). An image
  #  built on a normal x86 runner will NOT run there — it fails with
  #  "exec format error". Building on ubuntu-24.04-arm avoids both
  #  that and the very slow QEMU emulation alternative.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Kept as a STEP, not a separate job: a skipped job propagates "skipped"
      # down the needs chain, which silently skipped the deploy while the run
      # still reported success.
      - name: Confirmar deploy manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Digite DEPLOY no campo de confirmação para prosseguir."
            exit 1
          fi
          {
            echo "### Deploy manual"
            echo ""
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            echo "- **Motivo:** ${{ inputs.reason }}"
            echo "- **Disparado por:** @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: meta
        run: |
          echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  #  Ship it: copy the production compose file, pull, restart.
  #  The VM never needs the source code or git credentials.
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/btrad001
          strip_components: 1
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.build.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE,TAG,REGISTRY_USER,REGISTRY_TOKEN,DB_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/btrad001

            IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

            # Written fresh each deploy so secrets never linger in git.
            cat > .env <<EOF
            APP_IMAGE=${IMAGE_LC}:${TAG}
            DB_NAME=btrad001
            DB_USER=btrad
            DB_PASSWORD=${DB_PASSWORD}
            EOF
            chmod 600 .env

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

      - name: Wait for health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' btrad-app 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "✅ app healthy"
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "❌ app unhealthy — recent logs:"
                docker logs --tail 60 btrad-app
                exit 1
              fi
              sleep 10
            done
            echo "❌ timed out waiting for health"
            docker logs --tail 60 btrad-app
            exit 1
