# Production stack for the Oracle Cloud VM.
#
# Deliberately standalone: it references a pre-built image from GHCR and has no
# `build:` section, because the server never receives the source code. CI copies
# this file to /opt/btrad001 and writes the accompanying .env.
services:

  db:
    image: postgres:16-alpine
    container_name: btrad-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-btrad001}
      POSTGRES_USER: ${DB_USER:-btrad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - btrad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btrad} -d ${DB_NAME:-btrad001}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: btrad-app
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-btrad001}
      DB_USER: ${DB_USER:-btrad}
      DB_PASSWORD: ${DB_PASSWORD}
      BOT_PAPER_INITIAL_BALANCE: ${BOT_PAPER_INITIAL_BALANCE:-4000.00}
      BOT_PAPER_FEE_RATE: ${BOT_PAPER_FEE_RATE:-0.001}
      ROOT_LOG_LEVEL: ${ROOT_LOG_LEVEL:-INFO}
      TZ: America/Sao_Paulo
    ports:
      # Localhost only — the app has NO authentication. Reach the dashboard
      # through an SSH tunnel:
      #   ssh -L 8080:localhost:8080 ubuntu@<IP-DA-VM>
      # Never change this to "8080:8080" without putting auth in front of it.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      # Without this, a long-running bot slowly fills the boot volume.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Future news/sentiment analysis. Start with:
  #   docker compose -f docker-compose.prod.yml --profile n8n up -d
  n8n:
    image: n8nio/n8n:latest
    container_name: btrad-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - btrad-n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  btrad-db-data:
  btrad-n8n-data:
