quarkus:
  scheduler:
    enabled: true
  qute:
    strict-rendering: false
  http:
    port: 8080
  datasource:
    db-kind: postgresql
    username: ${DB_USER:btrad}
    password: ${DB_PASSWORD:btrad}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/btrad001}
  hibernate-validator:
    fail-fast: false
  hibernate-orm:
    log:
      sql: false
    database:
      # 'update' keeps bots across restarts. Use drop-and-create only when the
      # entity schema changes in a way H2 cannot migrate in place.
      generation: update
  log:
    level: ${ROOT_LOG_LEVEL:INFO}
    console:
      color: true
      format: '%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n'

bot:
  # Paper-trading wallet (v1 has no real money execution)
  paper:
    initial-balance: 4000.00
    fee-rate: 0.001          # 0.1% per side, matches Binance spot taker
  strategy:
    defaults:
      timeframe: 4h
      ema-fast: 9
      ema-slow: 21
      stop-loss-percent: 5
      order-size-brl: 100
  # Trading pairs offered in the create/backtest dropdowns
  symbol:
    list:
      - BTCBRL
      - ETHBRL
      - SOLBRL
      - BNBBRL
      - XRPBRL
      - DOGEBRL
      - LTCBRL
      - ADABRL
      - LINKBRL
      - AVAXBRL
