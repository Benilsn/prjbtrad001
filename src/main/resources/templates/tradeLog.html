<!DOCTYPE html>
<html lang="en">
{#include 'fragments/head.html'/}
<body style="overflow:hidden;">

<!-- ── HUD Overlay Bar ── -->
<div class="log-hud">
    <div class="log-status-dot"></div>
    <span class="log-hud-title">TRADE LOG</span>

    <div style="flex:1;max-width:420px;">
        <input type="text" id="log-filter" class="neon-input"
               style="height:34px;font-size:0.78rem;padding:4px 12px;"
               placeholder="Filter logs..."/>
    </div>

    <div class="ms-auto d-flex align-items-center gap-3">
        <span class="mono text-dim" style="font-size:0.7rem;" id="log-count"></span>
        <a href="/clear-trade-log" class="btn btn-neon btn-neon-red"
           style="font-size:0.75rem;padding:4px 14px;">
            ✕ Clear
        </a>
    </div>

    <!-- Wallet in HUD -->
    <div class="d-flex align-items-center gap-2 ms-3">
        <span style="color:var(--dim);font-size:0.7rem;font-family:'Share Tech Mono',monospace;">BAL</span>
        <span id="wallet-balance" style="font-size:0.85rem;">R$0,00</span>
    </div>
</div>

<!-- ── Fullscreen Log Terminal ── -->
<div id="log-screen">
    <div id="log-scroll">
        {#for item in data.orEmpty}
        <p class="log-entry">{item}</p>
        {/for}
        <span class="log-cursor"></span>
    </div>
</div>

<script>
    // Count visible entries
    function updateCount() {
        const total   = document.querySelectorAll('#log-scroll .log-entry').length;
        const visible = document.querySelectorAll('#log-scroll .log-entry:not(.hidden-log)').length;
        const el      = document.getElementById('log-count');
        if (el) el.textContent = visible < total ? `$\{visible} / $\{total} entries` : `$\{total} entries`;
}

document.addEventListener('DOMContentLoaded', function () {
    const scroll = document.getElementById('log-scroll');
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
    updateCount();

    const filter = document.getElementById('log-filter');
    if (filter) {
        filter.addEventListener('input', function () {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#log-scroll .log-entry').forEach(e => {
                e.classList.toggle('hidden-log', q.length > 0 && !e.textContent.toLowerCase().includes(q));
            });
            updateCount();
        });
    }
});

// Override refreshTradeLog to also update count
const _origRefresh = window.refreshTradeLog;
window._afterLogRefresh = updateCount;
</script>

</body>
{#include 'fragments/footer.html'/}
</html>
