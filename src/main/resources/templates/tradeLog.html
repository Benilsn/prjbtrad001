<!DOCTYPE html>
<html lang="en">

{#include 'fragments/head.html'/}

{#include 'fragments/navbar.html'/}

<body>

<div class="container-fluid p-0" style="height: calc(100vh - 140px); margin-top: 30px; margin-bottom: 100px;">
    <div class="row justify-content-center mx-0 w-100" style="height: 90%;">
        <div class="col-11 col-xl-10 h-100">
            <div class="trade-log-container h-100 d-flex flex-column">
                <div class="log-header d-flex justify-content-between align-items-center mb-3">
                    <div class="log-title text-center w-100">
                        <h4 class="neon-text mb-0"><i class="bi bi-terminal me-2"></i>TRADE LOG</h4>
                    </div>
                </div>

                <div class="d-flex flex-column flex-md-row justify-content-between mb-3">
                    <div class="position-relative flex-grow-1 me-md-3 mb-3 mb-md-0">
                        <input type="text" id="log-filter" class="form-control neon-input w-100"
                               placeholder="🔎 What are you looking for?"/>
                        <div class="position-absolute bottom-0 start-0 w-0" id="search-underline"
                             style="height: 1px; background: #00fff7; transition: width 0.3s ease;"></div>
                    </div>
                    <a href="/clear-trade-log" id="clear-log-btn" class="btn btn-clean-log-neon">
                        <i class="bi bi-trash-fill me-2"></i>Clean all logs
                    </a>
                </div>

                <!-- Conteúdo dos logs -->
                <div class="log-content-container flex-grow-1">
                    <div id="trade-log-content" class="h-100 p-3">
                        {#for item in data.orEmpty}
                        <p class="log-entry">{item}</p>
                        {/for}
                    </div>
                </div>

                <div class="log-footer text-center mt-3">
                    <span class="me-1">SYSTEM</span>
                    <span class="text-neon-cyan me-1">•</span>
                    <span class="text-neon-cyan me-1">STATUS</span>
                    <span class="text-glow-green">ONLINE</span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .trade-log-container {
        border: 1px solid #00fff7;
        border-radius: 2px;
        background-color: rgba(0, 0, 0, 0.7);
        box-shadow: 0 0 15px rgba(0, 255, 247, 0.5);
        padding: 20px;
        position: relative;
    }

    .log-content-container {
        border: 1px solid rgba(0, 255, 247, 0.3);
        background-color: rgba(0, 0, 0, 0.5);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
    }

    #trade-log-content {
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #00fff7 #111;
    }

    .log-entry {
        padding: 4px 0;
        font-family: 'Consolas', 'Courier New', monospace;
    }

    .log-footer {
        font-size: 0.8rem;
        opacity: 0.8;
    }

    .neon-input {
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid #00fff7;
        color: #e6e6e6;
    }

    .btn-clean-log-neon {
        padding: 8px 16px;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('log-filter');
        const searchUnderline = document.getElementById('search-underline');

        searchInput.addEventListener('focus', function() {
            searchUnderline.style.width = '100%';
        });

        searchInput.addEventListener('blur', function() {
            if (this.value === '') {
                searchUnderline.style.width = '0';
            }
        });

        searchInput.addEventListener('input', function() {
            const filterText = this.value.toLowerCase();
            const logEntries = document.querySelectorAll('.log-entry');

            logEntries.forEach(entry => {
                const text = entry.textContent.toLowerCase();
                if (text.includes(filterText)) {
                    entry.classList.remove('hidden-log');
                } else {
                    entry.classList.add('hidden-log');
                }
            });
        });
    });
</script>

</body>

{#include 'fragments/footer.html'/}

</html>
