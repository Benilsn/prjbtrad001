<!DOCTYPE html>
<html lang="en">
{#include 'fragments/head.html'/}
{#include 'fragments/navbar.html'/}
<body>

<main class="container my-4 pb-5">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4" style="animation: slideUp 0.4s ease both;">
        <div>
            <span class="page-title">Market Prices</span>
            <div class="mono" style="font-size:0.7rem;color:var(--dim);margin-top:2px;letter-spacing:1px;">
                LIVE · BINANCE
            </div>
        </div>
        <div class="text-end">
            <div class="mono" style="font-size:0.68rem;color:var(--dim);">LAST REFRESH</div>
            <div class="mono text-cyan" style="font-size:0.8rem;" id="last-refresh">—</div>
        </div>
    </div>

    <!-- Price grid -->
    <div class="row g-3" id="crypto-grid">
        {#for cripto in criptos}
        <div class="col-6 col-md-4 col-lg-3 card-animate">
            <div class="crypto-card h-100">
                <!-- Coin icon area -->
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <span class="crypto-symbol" id="{cripto}-label">{cripto}</span>
                    <span style="font-size:1.4rem;opacity:0.18;font-family:'Share Tech Mono',monospace;">◎</span>
                </div>
                <p class="crypto-price green-text" id="{cripto}-price">—</p>
                <p class="crypto-last-updated" id="{cripto}-updated">—</p>
            </div>
        </div>
        {/for}
    </div>

</main>

</body>
{#include 'fragments/footer.html'/}
</html>
