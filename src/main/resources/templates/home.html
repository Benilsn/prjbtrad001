<!DOCTYPE html>
<html lang="en">
{#include 'fragments/head.html'/}
{#include 'fragments/navbar.html'/}
<body>

<main class="container my-4 pb-5">

    <!-- Header row -->
    <div class="d-flex align-items-end justify-content-between mb-1"
         style="animation:slideUp .35s ease both">
        <div>
            <div class="mono mb-1"
                 style="font-size:.65rem;color:var(--dim);letter-spacing:2px">
                BINANCE · LIVE FEED · BRL
            </div>
            <span class="page-title">Market Prices</span>
        </div>
        <div class="text-end">
            <div class="mono" style="font-size:.63rem;color:var(--dim)">REFRESHED AT</div>
            <div class="mono text-cyan" style="font-size:.8rem" id="last-refresh">—</div>
        </div>
    </div>

    <!-- Glowing divider -->
    <div style="height:1px;margin:14px 0 22px;
                background:linear-gradient(90deg,transparent,var(--cyan) 40%,transparent);
                opacity:.4"></div>

    <!-- Price grid -->
    <div class="row g-3" id="crypto-grid">
        {#for cripto in criptos}
        <div class="col-6 col-md-4 col-lg-3 card-animate">
            <div class="crypto-card h-100">
                <span class="crypto-coin-icon">◎</span>
                <span class="crypto-symbol" id="{cripto}-label">{cripto}</span>
                <span class="crypto-price" id="{cripto}-price">—</span>
                <div class="crypto-last-updated" id="{cripto}-updated">—</div>
            </div>
        </div>
        {/for}
    </div>

</main>

</body>
{#include 'fragments/footer.html'/}
</html>
