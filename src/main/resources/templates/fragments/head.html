{#fragment id=head}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{pageTitle}</title>
    <link rel="icon" href="/images/btc-neon.png" type="image"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Tokens ─────────────────────────────────────────── */
        :root {
            --cyan:      #00e5ff;
            --green:     #00e676;
            --red:       #ff1744;
            --yellow:    #ffd740;
            --dim:       #7a8fa0;
            --text:      #f1f5f9;
            --text-soft: #cbd5e1;
            --bg:        #05080d;
            --surface:   rgba(11,15,21,0.95);
            --border:    rgba(0,229,255,0.16);
            --border-hi: rgba(0,229,255,0.55);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            min-height: 100vh;
            /* NO position, NO z-index here — keeps Bootstrap modal stacking clean */
        }

        /*
         * ── BACKGROUND DOT GRID ────────────────────────────────
         * Using a real <div id="bg-overlay"> (injected in footer.html)
         * instead of body::before / body::after pseudo-elements.
         * Pseudo-elements on <body> can create stacking contexts that
         * trap Bootstrap modals behind the backdrop. A real div with
         * negative z-index avoids this entirely.
         */
        #bg-overlay {
            position: fixed; inset: 0;
            background-image: radial-gradient(circle, rgba(0,229,255,0.055) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: -2;          /* behind everything, creates no stacking context on body */
        }

        /* ── Floating particles ──────────────────────────────── */
        #bg-particles {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .bg-particle {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan);
            animation: floatUp linear infinite;
            user-select: none;
        }
        @keyframes floatUp {
            from { transform: translateY(0) rotate(0deg);   opacity: var(--op); }
            to   { transform: translateY(-115vh) rotate(200deg); opacity: 0; }
        }

        code, .mono { font-family: 'Share Tech Mono', monospace; }
        a { text-decoration: none; color: inherit; }

        /* ── Navbar ─────────────────────────────────────────── */
        .cyber-navbar {
            background: rgba(5,8,13,0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            /* Override Bootstrap 5 navbar link color tokens */
            --bs-navbar-active-color:  var(--cyan);
            --bs-navbar-hover-color:   var(--cyan);
            --bs-navbar-color:         var(--text-soft);
        }
        .neon-text-logo {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan); letter-spacing: 3px; font-size: 1.05rem;
        }
        .neon-link { color: var(--text-soft); font-weight: 500; transition: color .2s; }
        /* Override Bootstrap's .nav-link.active which sets color to near-black */
        .neon-link:hover,
        .neon-link.active,
        .nav-link.neon-link.active { color: var(--cyan) !important; }
        #wallet-balance {
            font-family: 'Share Tech Mono', monospace;
            color: var(--green); font-size: .9rem;
        }

        /* ── Slide-up entrance ───────────────────────────────── */
        @keyframes slideUp {
            from { opacity:0; transform:translateY(22px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .card-animate { animation: slideUp .4s cubic-bezier(.16,1,.3,1) both; }
        .card-animate:nth-child(1)  { animation-delay:.04s }
        .card-animate:nth-child(2)  { animation-delay:.08s }
        .card-animate:nth-child(3)  { animation-delay:.12s }
        .card-animate:nth-child(4)  { animation-delay:.16s }
        .card-animate:nth-child(5)  { animation-delay:.20s }
        .card-animate:nth-child(6)  { animation-delay:.24s }
        .card-animate:nth-child(7)  { animation-delay:.28s }
        .card-animate:nth-child(8)  { animation-delay:.32s }
        .card-animate:nth-child(9)  { animation-delay:.36s }
        .card-animate:nth-child(10) { animation-delay:.40s }
        .card-animate:nth-child(11) { animation-delay:.44s }
        .card-animate:nth-child(12) { animation-delay:.48s }

        /* ── Bot card ────────────────────────────────────────── */
        .bot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color .22s, transform .18s, box-shadow .2s;
        }
        .bot-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0,229,255,.09);
        }

        /* ── Crypto price cards ──────────────────────────────── */
        .crypto-card {
            background: var(--surface);
            border: 1px solid rgba(0,229,255,0.22);
            border-radius: 10px;
            padding: 22px 18px 18px;
            position: relative; overflow: hidden;
            transition: border-color .22s, transform .18s, box-shadow .22s;
        }
        .crypto-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-3px);
            box-shadow: 0 0 24px rgba(0,229,255,.12), 0 6px 20px rgba(0,0,0,.4);
        }
        /* Top accent line */
        .crypto-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan) 50%, transparent);
            opacity: .55;
        }
        /* Subtle corner glow */
        .crypto-card::after {
            content: '';
            position: absolute; top: 0; right: 0;
            width: 60px; height: 60px;
            background: radial-gradient(circle at top right, rgba(0,229,255,.08), transparent 70%);
            pointer-events: none;
        }
        .crypto-symbol {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan); font-size: .72rem; letter-spacing: 2.5px;
            text-transform: uppercase; display: block; margin-bottom: 10px;
        }
        .crypto-name-big {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem; font-weight: 600; color: var(--text-soft);
            display: block; margin-bottom: 6px;
        }
        .crypto-price {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.4rem; color: var(--green);
            display: block; margin-bottom: 6px;
            transition: color .3s;
        }
        .green-text { color: var(--green); }
        .crypto-last-updated {
            font-size: .68rem; color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
        }
        /* Decorative coin icon top-right */
        .crypto-coin-icon {
            position: absolute; top: 14px; right: 14px;
            font-size: 1.5rem; opacity: .1;
            font-family: 'Share Tech Mono', monospace;
        }
        @keyframes priceFlash {
            0%   { background: rgba(0,230,118,.22); border-radius:4px; }
            100% { background: transparent; }
        }
        .price-flash { animation: priceFlash .65s ease-out; }
        @keyframes priceDown {
            0%   { background: rgba(255,23,68,.18); border-radius:4px; }
            100% { background: transparent; }
        }
        .price-down { animation: priceDown .65s ease-out; }

        /* ── Status pills ────────────────────────────────────── */
        .status-pill {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 2px 9px; border-radius: 20px;
            font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
        }
        .status-running {
            background: rgba(0,230,118,.1); color: var(--green);
            border: 1px solid rgba(0,230,118,.3);
        }
        .status-idle {
            background: rgba(122,143,160,.08); color: var(--dim);
            border: 1px solid rgba(122,143,160,.2);
        }
        @keyframes statusPulse {
            0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(0,230,118,.4); }
            50%     { opacity:.75; box-shadow:0 0 0 5px rgba(0,230,118,0); }
        }
        .animate-running { animation: statusPulse 1.8s ease-in-out infinite; }

        /* ── Typography ──────────────────────────────────────── */
        .label {
            font-size: .67rem; color: var(--dim);
            text-transform: uppercase; letter-spacing: .1em;
        }
        .value { font-family: 'Share Tech Mono', monospace; font-size: .9rem; color: var(--cyan); }
        .text-cyan    { color: var(--cyan); }
        .text-green   { color: var(--green); }
        .text-red     { color: var(--red); }
        .text-yellow  { color: var(--yellow); }
        .text-dim     { color: var(--dim); }
        .profit-positive { color: var(--green); }
        .profit-negative { color: var(--red); }
        .profit-zero     { color: var(--yellow); }
        .page-title {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan); font-size: 1.25rem; letter-spacing: 4px;
        }
        .section-title {
            font-size: .67rem; text-transform: uppercase; letter-spacing: .12em;
            color: var(--dim); padding-bottom: 6px;
            border-bottom: 1px solid var(--border); margin-bottom: 14px;
        }
        hr.neon-divider { border-color: var(--border); }

        /* ── Buttons ─────────────────────────────────────────── */
        .btn-neon {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Share Tech Mono', monospace; font-size: .78rem;
            padding: 5px 14px; border-radius: 4px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 5px;
            transition: all .15s; white-space: nowrap;
        }
        .btn-neon:hover {
            background: var(--cyan); color: var(--bg);
            box-shadow: 0 0 14px rgba(0,229,255,.35);
        }
        .btn-neon-green { border-color: var(--green); color: var(--green); }
        .btn-neon-green:hover { background: var(--green); color: var(--bg); box-shadow: 0 0 14px rgba(0,230,118,.35); }
        .btn-neon-red   { border-color: var(--red); color: var(--red); }
        .btn-neon-red:hover { background: var(--red); color: #fff; }
        .btn-neon-yellow { border-color: var(--yellow); color: var(--yellow); }
        .btn-neon-yellow:hover { background: var(--yellow); color: var(--bg); }
        .btn-delete-x {
            background: transparent; border: none; color: rgba(255,23,68,.35);
            font-size: .88rem; padding: 2px 6px; cursor: pointer; transition: color .2s;
        }
        .btn-delete-x:hover { color: var(--red); }

        /* ── Forms ───────────────────────────────────────────── */
        .form-control, .form-select {
            background: rgba(0,0,0,.45) !important;
            border: 1px solid var(--border) !important;
            color: var(--text) !important; border-radius: 5px !important;
            transition: border-color .2s, box-shadow .2s !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--cyan) !important;
            box-shadow: 0 0 0 3px rgba(0,229,255,.12) !important;
            color: var(--text) !important;
        }
        .form-select option { background: #0b0f15; color: var(--text); }
        .input-group-text {
            background: rgba(0,229,255,.07) !important;
            border: 1px solid var(--border) !important; color: var(--cyan) !important;
        }
        .neon-input {
            background: rgba(0,0,0,.5); border: 1px solid var(--border);
            color: var(--text); font-family: 'Share Tech Mono', monospace;
            border-radius: 5px; padding: 8px 12px; width: 100%;
            transition: border-color .2s, box-shadow .2s;
        }
        .neon-input:focus {
            border-color: var(--cyan); outline: none;
            box-shadow: 0 0 0 3px rgba(0,229,255,.12);
        }
        .neon-input::placeholder { color: var(--dim); }

        /*
         * ── MODAL FIX ─────────────────────────────────────────
         * Do NOT set position/z-index on .container or main.
         * That would create stacking contexts and trap modals behind
         * the Bootstrap backdrop. Let Bootstrap manage z-index naturally.
         */
        .modal-content {
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px; color: var(--text);
        }
        .modal-header { border-bottom: 1px solid var(--border); padding: 12px 16px; }
        .modal-footer { border-top: 1px solid var(--border); padding: 12px 16px; }
        /* Guarantee Bootstrap's own z-index values win */
        .modal         { z-index: 1055 !important; }
        .modal-backdrop { z-index: 1050 !important; }

        /* ── Trade log ───────────────────────────────────────── */
        #log-screen {
            position: fixed; inset: 0; padding-top: 58px;
            overflow: hidden; display: flex; flex-direction: column;
        }
        #log-scroll {
            flex: 1; overflow-y: auto; padding: 14px 32px 68px;
            scrollbar-width: thin; scrollbar-color: rgba(0,229,255,.18) transparent;
            -webkit-mask-image: linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.5) 7%,black 15%);
            mask-image: linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.5) 7%,black 15%);
        }
        #log-scroll::-webkit-scrollbar { width: 4px; }
        #log-scroll::-webkit-scrollbar-thumb { background: rgba(0,229,255,.14); border-radius: 2px; }
        .log-entry {
            font-family: 'Share Tech Mono', monospace;
            font-size: .8rem; color: rgba(0,230,118,.82);
            padding: 2px 0; margin: 0; line-height: 1.65;
            animation: logIn .25s ease-out both;
        }
        @keyframes logIn {
            from { opacity:0; transform:translateX(-6px); }
            to   { opacity:1; transform:translateX(0); }
        }
        .log-entry.hidden-log { display: none !important; }
        .log-cursor {
            display: inline-block; width: 8px; height: 13px;
            background: var(--cyan); vertical-align: middle; margin-left: 2px;
            animation: blink 1.1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .log-hud {
            position: fixed; top: 0; left: 0; right: 0; height: 58px;
            background: rgba(5,8,13,.92); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; padding: 0 18px;
            z-index: 200;   /* well above normal content, below Bootstrap modal (1050+) */
        }
        .log-hud-title {
            font-family: 'Share Tech Mono', monospace; color: var(--cyan);
            font-size: .82rem; letter-spacing: 3px; white-space: nowrap;
        }
        .log-status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 6px var(--green);
            flex-shrink: 0; animation: statusPulse 2s infinite;
        }
        /* Floating scroll-to-bottom button */
        #btn-log-bottom {
            position: fixed; bottom: 40px; right: 22px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,229,255,.1); border: 1px solid var(--border);
            color: var(--cyan); font-size: 1.15rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all .18s; z-index: 201;
        }
        #btn-log-bottom:hover { background: var(--cyan); color: var(--bg); }

        /* ── Footer ──────────────────────────────────────────── */
        .cyber-footer {
            background: rgba(5,8,13,.92); border-top: 1px solid var(--border);
            color: var(--dim); font-size: .75rem;
        }
        .cyber-footer a { color: var(--dim); transition: color .2s; }
        .cyber-footer a:hover { color: var(--cyan); }

        /* ── Misc ────────────────────────────────────────────── */
        .alert-danger {
            background: rgba(255,23,68,.07) !important;
            border: 1px solid rgba(255,23,68,.28) !important;
            color: #ff7096 !important; border-radius: 6px !important;
        }

        .alert-cyan {
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid rgba(0, 255, 255, 0.45);
            color: #7df9ff;
            box-shadow: 0 0 10px rgba(0,255,255,0.15);
            border-radius: 10px;

            animation:
                slideUp .4s cubic-bezier(.16,1,.3,1) both,
                smoothFadeOut 3s ease forwards;

            animation-delay: 3s, 5s;
        }

        @keyframes smoothFadeOut {
            0% {
                opacity: 1;
                filter: blur(0px);
            }

           30% {
                opacity: 0.80;
                filter: blur(0.5px);
            }

            70% {
                opacity: 0.50;
                filter: blur(0.5px);
            }

            100% {
                opacity: 0;
                filter: blur(2px);
            }
        }

        .hidden-log { display: none !important; }
        ::selection { background: rgba(0,229,255,.2); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,229,255,.12); border-radius: 3px; }
    </style>
</head>
{/fragment}
