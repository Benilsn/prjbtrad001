{#fragment id=head}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{pageTitle} · btrad001</title>
    <link rel="icon" href="/images/btc-neon.png" type="image"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        {|
        /* ──────────────────────────────────────────────────────────
           Design tokens.

           Colour carries meaning here, it does not decorate: green and
           red mean money, amber means caution, everything else is a
           neutral grey. Numbers are monospaced so columns line up and
           digits stay the same width as they change.
           ────────────────────────────────────────────────────────── */
        :root {
            --bg:          #0b0d11;
            --surface:     #12151b;
            --surface-2:   #171b22;
            --surface-3:   #1d222b;

            --border:      rgba(255,255,255,.07);
            --border-mid:  rgba(255,255,255,.12);
            --border-hi:   rgba(255,255,255,.20);

            --text:        #e7eaee;
            --text-2:      #a8b0bb;
            --text-3:      #6b7481;

            --accent:      #4c8dff;
            --accent-soft: rgba(76,141,255,.12);

            --pos:         #2ea86a;
            --pos-soft:    rgba(46,168,106,.12);
            --neg:         #e0524d;
            --neg-soft:    rgba(224,82,77,.12);
            --warn:        #d99a2b;
            --warn-soft:   rgba(217,154,43,.12);

            --radius:      8px;
            --radius-sm:   6px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }

        /* Tabular figures keep digits from shifting as values update. */
        .mono, code, .num {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ── Top bar ─────────────────────────────────────────────── */
        .topbar {
            background: rgba(11,13,17,.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            height: 52px;
        }
        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: .9rem; font-weight: 600;
            color: var(--text); letter-spacing: -.01em;
        }
        .brand .dot { color: var(--accent); }
        .nav-item-link {
            color: var(--text-3); font-weight: 500; font-size: .86rem;
            padding: 6px 10px; border-radius: var(--radius-sm);
            transition: color .15s, background .15s;
        }
        .nav-item-link:hover { color: var(--text); background: var(--surface-2); }
        .nav-item-link.active { color: var(--text); background: var(--surface-2); }

        /* ── Page header ─────────────────────────────────────────── */
        .page-title {
            font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; color: var(--text);
        }
        .kicker {
            font-size: .68rem; font-weight: 500; color: var(--text-3);
            text-transform: uppercase; letter-spacing: .08em;
        }
        .section-label {
            font-size: .7rem; font-weight: 600; color: var(--text-3);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
        }
        .rule { height: 1px; background: var(--border); border: 0; }

        /* ── Metric tiles ────────────────────────────────────────── */
        .metrics {
            display: grid; gap: 1px; background: var(--border);
            border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }
        .metric { background: var(--surface); padding: 14px 16px; }
        .metric .k {
            font-size: .68rem; color: var(--text-3); font-weight: 500;
            text-transform: uppercase; letter-spacing: .05em;
        }
        .metric .v {
            font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;
            font-size: 1.15rem; font-weight: 500; margin-top: 5px; letter-spacing: -.02em;
        }
        .metric .sub { font-size: .7rem; color: var(--text-3); margin-top: 2px; }

        /* ── Cards ───────────────────────────────────────────────── */
        .card-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color .15s, background .15s;
        }
        .card-panel:hover { border-color: var(--border-mid); }

        .card-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; border-bottom: 1px solid var(--border);
        }
        .card-body { padding: 12px 14px; }
        .card-foot { padding: 10px 14px; border-top: 1px solid var(--border); }

        .pair {
            font-family: 'JetBrains Mono', monospace;
            font-size: .92rem; font-weight: 600; letter-spacing: -.01em;
        }
        .pair-meta { font-size: .72rem; color: var(--text-3); margin-top: 1px; }

        /* ── Status ──────────────────────────────────────────────── */
        .status {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: .68rem; font-weight: 600; letter-spacing: .04em;
            padding: 3px 8px; border-radius: 20px; text-transform: uppercase;
        }
        .status .led { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .status-on  { color: var(--pos); background: var(--pos-soft); }
        .status-off { color: var(--text-3); background: var(--surface-3); }
        @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
        .status-on .led { animation: breathe 2.4s ease-in-out infinite; }

        /* ── Data rows ───────────────────────────────────────────── */
        .row-data {
            display: flex; align-items: baseline; justify-content: space-between;
            padding: 5px 0; font-size: .8rem;
        }
        .row-data + .row-data { border-top: 1px solid rgba(255,255,255,.04); }
        .row-data .k { color: var(--text-3); }
        .row-data .v {
            font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;
            color: var(--text-2);
        }

        .pos { color: var(--pos) !important; }
        .neg { color: var(--neg) !important; }
        .neutral { color: var(--text-3) !important; }
        .accent { color: var(--accent) !important; }
        .dim { color: var(--text-3) !important; }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn-app {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: .78rem; font-weight: 500; padding: 6px 12px;
            border-radius: var(--radius-sm); border: 1px solid var(--border-mid);
            background: var(--surface-2); color: var(--text-2);
            transition: background .15s, border-color .15s, color .15s;
            cursor: pointer; white-space: nowrap;
        }
        .btn-app:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-hi); }
        .btn-primary-app {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        .btn-primary-app:hover { background: #3f7de8; border-color: #3f7de8; color: #fff; }
        .btn-pos { color: var(--pos); border-color: rgba(46,168,106,.35); background: var(--pos-soft); }
        .btn-pos:hover { background: rgba(46,168,106,.2); color: var(--pos); border-color: var(--pos); }
        .btn-neg { color: var(--neg); border-color: rgba(224,82,77,.3); background: var(--neg-soft); }
        .btn-neg:hover { background: rgba(224,82,77,.18); color: var(--neg); border-color: var(--neg); }
        .btn-icon {
            background: transparent; border: none; color: var(--text-3);
            padding: 2px 6px; cursor: pointer; font-size: .95rem; line-height: 1;
            border-radius: 4px; transition: color .15s, background .15s;
        }
        .btn-icon:hover { color: var(--neg); background: var(--neg-soft); }

        /* ── Forms ───────────────────────────────────────────────── */
        .form-label {
            font-size: .72rem; font-weight: 500; color: var(--text-3);
            margin-bottom: 5px; letter-spacing: .01em;
        }
        .form-control, .form-select {
            background: var(--surface-2) !important;
            border: 1px solid var(--border-mid) !important;
            color: var(--text) !important;
            border-radius: var(--radius-sm) !important;
            font-size: .85rem !important; padding: 7px 10px !important;
            font-family: 'JetBrains Mono', monospace !important;
            transition: border-color .15s, box-shadow .15s !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px var(--accent-soft) !important;
        }
        .form-control::placeholder { color: var(--text-3); }
        .form-select option { background: var(--surface-2); color: var(--text); }
        .input-group-text {
            background: var(--surface-3) !important; border: 1px solid var(--border-mid) !important;
            color: var(--text-3) !important; font-size: .8rem !important;
            font-family: 'JetBrains Mono', monospace !important;
        }
        .form-check-input {
            background-color: var(--surface-2); border-color: var(--border-hi);
        }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

        /* ── Tables ──────────────────────────────────────────────── */
        .table-app { width: 100%; font-size: .8rem; border-collapse: collapse; }
        .table-app th {
            font-size: .68rem; font-weight: 600; color: var(--text-3);
            text-transform: uppercase; letter-spacing: .05em;
            padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left;
            position: sticky; top: 0; background: var(--surface);
        }
        .table-app td {
            padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.04);
            font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;
            color: var(--text-2);
        }
        .table-app tbody tr:hover { background: var(--surface-2); }
        .table-scroll { max-height: 380px; overflow-y: auto; }

        /* ── Modal ───────────────────────────────────────────────── */
        .modal-content {
            background: var(--surface); border: 1px solid var(--border-mid);
            border-radius: var(--radius); color: var(--text);
        }
        .modal-header, .modal-footer { border-color: var(--border) !important; padding: 12px 16px; }
        .modal { z-index: 1055 !important; } .modal-backdrop { z-index: 1050 !important; }

        /* ── Alerts ──────────────────────────────────────────────── */
        .alert-app {
            border-radius: var(--radius-sm); padding: 10px 14px; font-size: .82rem;
            border: 1px solid var(--border-mid); background: var(--surface-2); color: var(--text-2);
        }
        .alert-warn-app { border-color: rgba(217,154,43,.3); background: var(--warn-soft); color: #e8bd72; }

        .empty {
            border: 1px dashed var(--border-mid); border-radius: var(--radius);
            padding: 44px 24px; text-align: center; color: var(--text-3);
            background: var(--surface);
        }

        /* ── Chart ───────────────────────────────────────────────── */
        .chart-panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px;
        }

        /* ── Misc ────────────────────────────────────────────────── */
        ::selection { background: rgba(76,141,255,.25); }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a313c; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
        .fade-in { animation: fadeIn .22s ease-out both; }
        |}
    </style>
</head>
{/fragment}
