{#fragment id=head}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{pageTitle}</title>
    <link rel="icon" href="/images/btc-neon.png" type="image"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ── Base ── */
        :root {
            --cyan:   #00e5ff;
            --green:  #00e676;
            --red:    #ff1744;
            --yellow: #ffd740;
            --dim:    #8899aa;
            --bg:     #080c10;
            --surface:#0e1318;
            --border: rgba(0, 229, 255, 0.2);
        }

        body {
            background-color: var(--bg);
            color: #ccd6e0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
        }

        code, .mono { font-family: 'Share Tech Mono', monospace; }

        /* ── Navbar ── */
        .cyber-navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .neon-text-logo {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan);
            letter-spacing: 2px;
        }

        .neon-link { color: #ccd6e0; transition: color 0.2s; text-decoration: none; }
        .neon-link:hover { color: var(--cyan); }

        /* ── Utility colors ── */
        .text-cyan   { color: var(--cyan); }
        .text-green  { color: var(--green); }
        .text-red    { color: var(--red); }
        .text-yellow { color: var(--yellow); }
        .text-dim    { color: var(--dim); }

        /* ── Card ── */
        .bot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s, transform 0.15s;
        }
        .bot-card:hover {
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        /* ── Labels / values ── */
        .label {
            font-size: 0.7rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: var(--cyan);
        }

        /* ── Status pill ── */
        .status-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .status-running { background: rgba(0,230,118,0.12); color: var(--green); border: 1px solid rgba(0,230,118,0.35); }
        .status-idle    { background: rgba(255,23,68,0.08);  color: var(--red);   border: 1px solid rgba(255,23,68,0.25); }

        /* ── Buttons ── */
        .btn-neon {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .btn-neon:hover { background: var(--cyan); color: var(--bg); }

        .btn-neon-green { border-color: var(--green); color: var(--green); }
        .btn-neon-green:hover { background: var(--green); color: var(--bg); }

        .btn-neon-red { border-color: var(--red); color: var(--red); }
        .btn-neon-red:hover { background: var(--red); color: var(--bg); }

        .btn-neon-yellow { border-color: var(--yellow); color: var(--yellow); }
        .btn-neon-yellow:hover { background: var(--yellow); color: var(--bg); }

        /* ── Divider ── */
        .neon-divider { border-color: var(--border); }

        /* ── Modal ── */
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ccd6e0;
        }
        .modal-header { border-bottom: 1px solid var(--border); }
        .modal-footer { border-top: 1px solid var(--border); }

        /* ── Trade log ── */
        .trade-log-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 520px;
            overflow-y: auto;
        }
        .log-entry {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.82rem;
            color: var(--green);
            padding: 2px 0;
        }
        .trade-log-box::-webkit-scrollbar { width: 6px; }
        .trade-log-box::-webkit-scrollbar-track { background: var(--bg); }
        .trade-log-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── Neon input ── */
        .neon-input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            border-radius: 6px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .neon-input:focus { border-color: var(--cyan); outline: none; box-shadow: none; }
        .neon-input::placeholder { color: var(--dim); }

        /* ── Footer ── */
        .cyber-footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            color: var(--dim);
            font-size: 0.82rem;
        }
        .cyber-footer a { color: var(--dim); text-decoration: none; transition: color 0.2s; }
        .cyber-footer a:hover { color: var(--cyan); }

        /* ── Section title ── */
        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--dim);
            margin-bottom: 1rem;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        /* ── Page title ── */
        .page-title {
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan);
            font-size: 1.4rem;
            letter-spacing: 3px;
        }

        /* ── Profit colors ── */
        .profit-positive { color: var(--green); }
        .profit-negative { color: var(--red); }
        .profit-zero     { color: var(--yellow); }

        /* ── Running pulse ── */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }
        .animate-running { animation: pulse 1.6s ease-in-out infinite; }

        /* ── Delete x button ── */
        .btn-delete-x {
            background: transparent;
            border: none;
            color: rgba(255,23,68,0.5);
            font-size: 1rem;
            line-height: 1;
            padding: 2px 6px;
            transition: color 0.2s;
        }
        .btn-delete-x:hover { color: var(--red); }

        /* ── Wallet display ── */
        #wallet-balance {
            font-family: 'Share Tech Mono', monospace;
            color: var(--green);
            font-size: 1rem;
        }

        /* ── hidden log ── */
        .hidden-log { display: none; }
    </style>
</head>

{/fragment}
