{#fragment id=footer}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /* ═══════════════════════════════════════════════════
       FLOATING CRYPTO BACKGROUND PARTICLES
    ═══════════════════════════════════════════════════ */
    (function initParticles() {
        const syms = ['₿','Ξ','Ł','Ð','◎','⬡','◈','✦','⊕','Ŧ','Ⓐ','⟡'];
        const bg   = document.createElement('div');
        bg.id      = 'bg-particles';
        document.body.prepend(bg);
        for (let i = 0; i < 28; i++) {
            const s        = document.createElement('span');
            const size     = 12 + Math.random() * 36;
            const left     = Math.random() * 100;
            const delay    = Math.random() * 25;
            const duration = 18 + Math.random() * 35;
            const opacity  = 0.018 + Math.random() * 0.035;
            s.textContent  = syms[Math.floor(Math.random() * syms.length)];
            s.className    = 'bg-particle';
            s.style.cssText = `
                left:$\{left}%;bottom:-60px;
                font-size:$\{size}px;
                --op:$\{opacity};
                animation-duration:$\{duration}s;
                animation-delay:$\{delay}s;
            `;
        bg.appendChild(s);
    }
})();

/* ═══════════════════════════════════════════════════
   BOOTSTRAP INIT
═══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

    /* ─── Wallet ─── */
    fetchWallet();
    setInterval(fetchWallet, 20000);

    /* ─── Prices (home page only) ─── */
    if (window.location.pathname === '/') {
        fetchPrices();
        setInterval(fetchPrices, 3000);
    }

    /* ─── Trade log page ─── */
    const logScroll = document.getElementById('log-scroll');
    if (logScroll) {
        refreshTradeLog();
        setInterval(refreshTradeLog, 8000);
    }

    /* ─── Log filter ─── */
    const logFilter = document.getElementById('log-filter');
    if (logFilter) {
        logFilter.addEventListener('input', function () {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#log-scroll .log-entry').forEach(e => {
                e.classList.toggle('hidden-log', !e.textContent.toLowerCase().includes(q));
            });
        });
    }

    /* ─── Purchase strategy symbol ─── */
    const strategySelect = document.querySelector('select[name="purchaseStrategy"]');
    const amountSymbol   = document.getElementById('amountSymbol');
    if (strategySelect && amountSymbol) {
        function updateSymbol() {
            amountSymbol.textContent = strategySelect.value === 'PERCENTAGE' ? '%' : 'R$';
        }
        strategySelect.addEventListener('change', updateSymbol);
        updateSymbol();
    }
});

/* ═══════════════════════════════════════════════════
   WALLET
═══════════════════════════════════════════════════ */
function fetchWallet() {
    fetch('/refresh-wallet-data')
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => {
            const el = document.getElementById('wallet-balance');
            if (el) el.textContent = 'R$' + data.balance;
        })
        .catch(e => console.warn('Wallet fetch:', e));
}

/* ═══════════════════════════════════════════════════
   CRYPTO PRICES
═══════════════════════════════════════════════════ */
async function fetchPrices() {
    try {
        const symbols = "{workingSymbols ?: ''}".split(',').filter(Boolean);
        const params  = new URLSearchParams({ symbols: JSON.stringify(symbols) });
        const data    = await fetch('/refresh-data?' + params).then(r => r.json());

        const refreshEl = document.getElementById('last-refresh');
        if (refreshEl) refreshEl.textContent = new Date().toLocaleTimeString('pt-BR');

        for (const crypto of data) {
            const priceEl   = document.getElementById(crypto.symbol + '-price');
            const updatedEl = document.getElementById(crypto.symbol + '-updated');
            const labelEl   = document.getElementById(crypto.symbol + '-label');

            if (labelEl)   labelEl.textContent   = crypto.symbol;
            if (updatedEl) updatedEl.textContent  = crypto.lastUpdated;
            if (priceEl) {
                const prev = priceEl.dataset.prev;
                priceEl.textContent   = crypto.price;
                priceEl.dataset.prev  = crypto.price;
                if (prev && prev !== crypto.price) {
                    priceEl.classList.remove('price-flash');
                    void priceEl.offsetWidth; // reflow
                    priceEl.classList.add('price-flash');
                }
            }
        }
    } catch (e) {
        console.warn('Price fetch:', e);
    }
}

/* ═══════════════════════════════════════════════════
   TRADE LOG
═══════════════════════════════════════════════════ */
async function refreshTradeLog() {
    try {
        const data    = await fetch('/refresh-log-data').then(r => r.json());
        const logEl   = document.getElementById('log-scroll');
        if (!logEl) return;

        // Keep filter value
        const filter  = document.getElementById('log-filter')?.value?.toLowerCase() || '';

        logEl.innerHTML = '';
        data.forEach(item => {
            const p         = document.createElement('p');
            p.className     = 'log-entry';
            p.textContent   = item;
            if (filter && !item.toLowerCase().includes(filter)) p.classList.add('hidden-log');
            logEl.appendChild(p);
        });

        // Cursor blink at end
        const cursor        = document.createElement('span');
        cursor.className    = 'log-cursor';
        logEl.appendChild(cursor);

        logEl.scrollTop = logEl.scrollHeight;
    } catch (e) {
        console.warn('Log fetch:', e);
    }
}

/* ═══════════════════════════════════════════════════
   MISC
═══════════════════════════════════════════════════ */
window.addEventListener('load', function () {
    if (new URLSearchParams(window.location.search).has('message')) {
        setTimeout(() => window.history.replaceState({}, '', window.location.pathname), 2500);
    }
});
</script>

        <span class="mx-1" style="color:var(--border)">·</span>

    </div>
</footer>

{/fragment}
