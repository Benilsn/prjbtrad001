{#fragment id=footer}
<div id="bg-overlay"></div>
<div id="bg-particles"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    {|
    // Floating hex/binary particles — purely decorative.
    (function () {
        const host = document.getElementById('bg-particles');
        if (!host) return;
        const glyphs = ['0', '1', '↑', '↓', '◇', '·', 'ƒ', 'Σ'];
        const count = Math.min(22, Math.floor(window.innerWidth / 70));
        for (let i = 0; i < count; i++) {
            const s = document.createElement('span');
            s.className = 'bg-particle';
            s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
            const size = 10 + Math.random() * 14;
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = 100 + Math.random() * 20 + 'vh';
            s.style.fontSize = size + 'px';
            s.style.setProperty('--op', (0.05 + Math.random() * 0.15).toFixed(2));
            s.style.animationDuration = (16 + Math.random() * 26) + 's';
            s.style.animationDelay = (-Math.random() * 30) + 's';
            host.appendChild(s);
        }
    })();

    // Auto-dismiss flash messages.
    window.addEventListener('DOMContentLoaded', () => {
        const msg = document.getElementById('flash-message');
        if (msg) {
            msg.style.transition = 'opacity 1.5s ease';
            setTimeout(() => (msg.style.opacity = '0'), 2600);
            setTimeout(() => msg.remove(), 4200);
        }
    });
    |}
</script>
{/fragment}
